 s+=`<line x1="${l}" x2="${W-r}" y1="${H-40}" y2="${H-40}" stroke="#ddd5ca"/>`;
 top.forEach((t,i)=>{const y=40+i*62,right=Math.max(t.price,t.hi),left=Math.min(t.price,t.lo),end=X(right)>W*0.72;
  s+=`<text x="${end?X(right):X(left)}" y="${y-12}" text-anchor="${end?"end":"start"}" font-size="12.5" font-weight="700" fill="#111" ${F}>${esc(t.addr)}</text>`;
  s+=`<line x1="${X(t.price)}" x2="${X(t.mid)}" y1="${y}" y2="${y}" stroke="#cbbfb1" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  s+=`<rect x="${X(t.lo)}" y="${y-7}" width="${Math.max(4,X(t.hi)-X(t.lo))}" height="14" rx="7" fill="${i===0?"#b4583a":"#111"}"/>`;
  s+=`<circle cx="${X(t.price)}" cy="${y}" r="6" fill="#cbbfb1" stroke="#fff" stroke-width="2"><title>Sold ${fmt$(t.price)}</title></circle>`;});
 svg.innerHTML=s;
})();

/* comps */
const comps=D.comps.map(c=>({...c,psf:c.price/c.sqft,t:Date.parse(c.date+"T12:00:00"),top:topSet.has(c.addr),
 bsmt:c.bsmt||(c.bsmt_fin?c.bsmt_fin.toLocaleString()+" sq ft finished":"Unfinished"),d:new Date(c.date+"T12:00:00").toLocaleDateString("en-CA",{month:"short",day:"numeric"})}));
const sub=D.subject;
function render(key){
 const rows=[...comps].sort((a,b)=>(key==="date"?b.t-a.t:b[key]-a[key]));
 const lot=v=>v==null?"n/a":Number(v).toFixed(2);
 document.getElementById("tbody").innerHTML=`<tr class="subject"><td>${esc(D.address)} (yours)</td><td>For sale</td><td class="r">MPAC ${fmt$(D.mpac.value)}</td><td class="r">${sub.sqft.toLocaleString()}</td><td class="r">n/a</td><td class="r">${sub.built}</td><td class="r">${sub.bed}</td><td>${esc(sub.bath)}</td><td>${esc(sub.bsmt)}</td><td class="r">${lot(sub.lot)}</td><td class="note">${esc(sub.note||"")}</td><td></td></tr>`+
 rows.map(c=>`<tr${c.top?' class="top"':''}><td>${esc(c.addr)}${c.top?`<span class="tag">Top ${nTop}</span>`:""}</td><td>${c.d}</td><td class="r">${fmt$(c.price)}</td><td class="r">${c.sqft.toLocaleString()}</td><td class="r">$${Math.round(c.psf)}</td><td class="r">${c.built}</td><td class="r">${c.bed}</td><td>${esc(c.bath)}</td><td>${esc(c.bsmt)}</td><td class="r">${lot(c.lot)}</td><td class="note">${esc(c.note||"")}</td><td>${c.mls?`<a href="${link(c.mls)}" target="_blank" rel="noopener">${esc(c.mls)}</a>`:""}</td></tr>`).join("");
 document.getElementById("mlist").innerHTML=rows.map(c=>`<div class="mcard${c.top?" top":""}"><div class="t"><b>${esc(c.addr)}${c.top?`<span class="tag">Top ${nTop}</span>`:""}</b><span>${fmt$(c.price)}</span></div><div class="meta">Sold ${c.d} · ${c.sqft.toLocaleString()} sq ft · $${Math.round(c.psf)}/sq ft · ${c.bed} bed · ${esc(c.bath)} bath · built ${c.built}</div><div class="meta">Basement: ${esc(c.bsmt)} · Lot ${c.lot==null?"n/a":lot(c.lot)+" ac"}</div><div class="n">${esc(c.note||"")} ${c.mls?`<a href="${link(c.mls)}" target="_blank" rel="noopener">${esc(c.mls)}</a>`:""}</div></div>`).join("");
}
const sel=document.getElementById("sortSel");sel.addEventListener("change",()=>render(sel.value));render("date");

/* scatter */
(function(){
 const W=680,H=320,m={l:60,r:16,t:16,b:38},F='font-family="Manrope, sans-serif"';
 const ts=comps.map(c=>c.t),first=new Date(Math.min(...ts)),last=new Date(Math.max(...ts));
 const t0=new Date(first.getFullYear(),first.getMonth(),1).getTime(),t1=new Date(last.getFullYear(),last.getMonth()+1,1).getTime();
 const pv=comps.map(c=>c.price).concat([D.mpac.low,D.mpac.high]);
 const span=Math.max(...pv)-Math.min(...pv),step=span>600000?200000:span>300000?100000:50000;
 const y0=Math.floor((Math.min(...pv)-step/4)/step)*step,y1=Math.ceil((Math.max(...pv)+step/4)/step)*step;
 const X=t=>m.l+(t-t0)/(t1-t0)*(W-m.l-m.r),Y=v=>H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);
 const svg=document.getElementById("chart");svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
 let s=`<rect x="${m.l}" y="${Y(D.mpac.high)}" width="${W-m.l-m.r}" height="${Y(D.mpac.low)-Y(D.mpac.high)}" fill="#f7e6de"/>`;
 for(let v=y0;v<=y1;v+=step){s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#f1ece5"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#6f675e" ${F}>${fmtK(v)}</text>`;}
 s+=`<text x="${W-m.r-4}" y="${Y(D.mpac.high)-6}" text-anchor="end" font-size="11" font-weight="700" fill="#b4583a" ${F}>MPAC value range for your home</text>`;
 for(let d=new Date(t0);d.getTime()<=t1;d.setMonth(d.getMonth()+1)){s+=`<text x="${X(d.getTime())}" y="${H-m.b+20}" text-anchor="middle" font-size="11" fill="#6f675e" ${F}>${d.toLocaleDateString("en-CA",{month:"short"})}</text>`;}
 s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}" stroke="#ddd5ca"/>`;
 comps.filter(c=>!c.top).concat(comps.filter(c=>c.top)).forEach(c=>{
  s+=`<circle cx="${X(c.t)}" cy="${Y(c.price)}" r="${c.top?7:5}" fill="${c.top?"#111":"#cbbfb1"}" stroke="#fff" stroke-width="2"><title>${esc(c.addr)}: ${fmt$(c.price)}</title></circle>`;
  if(c.top){const end=X(c.t)>W*0.7;s+=`<text x="${X(c.t)+(end?-9:9)}" y="${Y(c.price)+4}" text-anchor="${end?"end":"start"}" font-size="11.5" font-weight="700" fill="#111" ${F}>${esc(c.addr)}</text>`;}
 });
 svg.innerHTML=s;
})();

/* calculator */
const num=id=>{const v=parseFloat(String(document.getElementById(id).value).replace(/[^0-9.]/g,""));return isFinite(v)?v:0;};
function calc(){const p=num("salePrice"),comm=p*num("commRate")/100,hst=comm*.13,mort=num("mortgage"),legal=num("legal"),prep=num("prep");
 const set=(id,v,neg)=>document.getElementById(id).textContent=(neg&&v?"−":"")+fmt$(v);
 set("oPrice",p);set("oComm",comm,1);set("oHst",hst,1);set("oMort",mort,1);set("oLegal",legal,1);set("oPrep",prep,1);
 document.getElementById("oNet").textContent=fmt$(p-comm-hst-mort-legal-prep);}
const f=document.getElementById("calcForm");f.addEventListener("input",calc);f.addEventListener("submit",e=>e.preventDefault());calc();
document.querySelectorAll(".copy").forEach(b=>b.addEventListener("click",()=>{const el=document.getElementById(b.dataset.target);
 const done=t=>{b.textContent=t;setTimeout(()=>b.textContent="Copy",1600);};
 const fb=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);done("Selected");};
 try{navigator.clipboard.writeText(el.textContent).then(()=>done("Copied"),fb);}catch(e){fb();}}));
})();
</script>
</body>
